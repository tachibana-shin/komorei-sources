name: Build source list

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build source list
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` so vi.animevietsub is built and published like
      # every other source, even though its repository is private.
      #
      # That asymmetry is the point: the .krx is a public artifact the app
      # downloads and every user can already obtain from this Pages site, and
      # withholding it would be withholding a released source, not protecting
      # anything. What stays private is the implementation — so it cannot be read,
      # forked or repackaged into a modified source, which is what publishing a
      # `.krx` does not permit anyway.
      #
      # Needs a token because the submodule lives in a private repository; see
      # PAT_TOKEN.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            **/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install komorei CLI
        run: |
          set -euo pipefail
          # The CLI is built from the SDK repository, so it still has to be
          # checked out — but only to BUILD the CLI. The source crates do not need
          # it beside them any more: each takes the SDK as a git dependency, so
          # cargo fetches it and this layout no longer has to be reproduced.
          sdk_dir="$RUNNER_TEMP/komorei-sdk"
          git clone --depth 1 https://github.com/tachibana-shin/komorei-sdk.git "$sdk_dir"
          cargo install --path "$sdk_dir/crates/cli" --locked

      - name: Build sources
        run: komorei repo build --root . --output public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy source list
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
