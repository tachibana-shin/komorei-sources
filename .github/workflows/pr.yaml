name: Check PR
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify-sources:
    name: Verify sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install komorei CLI
        run: |
          set -euo pipefail
          # Every source crate depends on `../../../komorei-sdk/crates/lib`, so the
          # SDK has to sit NEXT TO this repository's root, not inside it.
          sdk_dir="$GITHUB_WORKSPACE/../komorei-sdk"
          git clone --depth 1 https://github.com/tachibana-shin/komorei-sdk.git "$sdk_dir"
          cargo install --path "$sdk_dir/crates/cli" --locked

      - name: Build and verify sources
        run: komorei repo verify --root .

  rust-lint:
    name: Rust formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Checkout komorei-sdk
        run: |
          set -euo pipefail
          # `cargo clippy` resolves each crate's `../../../komorei-sdk` path
          # dependency, so the SDK has to sit NEXT TO this repository's root.
          git clone --depth 1 https://github.com/tachibana-shin/komorei-sdk.git \
            "$GITHUB_WORKSPACE/../komorei-sdk"

      - name: Lint sources
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r cargo_toml; do
            crate="$(dirname "$cargo_toml")"
            if [[ -f "$crate/.skip" ]]; then
              echo "::notice::Skipping $crate (marked .skip)"
              continue
            fi
            echo "::group::Linting $crate"
            (cd "$crate" && cargo fmt --check) || failed=1
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown -- -D warnings) || failed=1
            echo "::endgroup::"
          done < <(find . -name Cargo.toml -not -path './target/*' -not -path '*/target/*' | sort)
          exit $failed
