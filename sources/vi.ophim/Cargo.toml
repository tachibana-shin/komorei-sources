[package]
name = "ophim-source"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
komorei = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei", features = ["json"] }
# Direct dep because serde's derive macro expands to `::serde` paths.
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
komorei = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei", features = ["test"] }
komorei-test = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei-test" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true