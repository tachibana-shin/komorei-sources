[package]
name = "animevietsub-source"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
komorei = { path = "../../../komorei-sdk/crates/lib", features = ["json"] }
# Direct dep because serde's derive macro expands to `::serde` paths.
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
# The USDK envelope payload and the JWT `jti` claim are both small JSON objects
# decoded from base64 inside `crypto`.
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# The AVS shield encrypts the playlist body with AES-256-GCM (key derived via
# HMAC-SHA256) and the segment urls with AES-256-CTR, so the crypto crates are
# real dependencies of the wasm module rather than host imports.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
komorei = { path = "../../../komorei-sdk/crates/lib", features = ["test"] }
komorei-test = { path = "../../../komorei-sdk/crates/test-macro" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
