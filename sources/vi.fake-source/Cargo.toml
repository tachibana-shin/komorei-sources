[package]
name = "fake-vi-source"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
komorei = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei" }

[dev-dependencies]
komorei = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei", features = ["test"] }
komorei-test = { git = "https://github.com/tachibana-shin/komorei-sdk", branch = "main", package = "komorei-test" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
